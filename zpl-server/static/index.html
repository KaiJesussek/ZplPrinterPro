<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZPL Printer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>ZPL Printer</h1>
  <button id="logout" type="button" hidden>Log out</button>
  <div id="state-panel" aria-label="Printer conditions"></div>
  <span id="diag-badge" title="Diagnostics">loading&hellip;</span>
  <details id="storage-box">
    <summary>Storage</summary>
    <table id="storage-table">
      <thead><tr><th>Kind</th><th>Name</th><th>Details</th><th>Size</th></tr></thead>
      <tbody></tbody>
    </table>
  </details>
</header>
<div id="login" hidden>
  <div id="login-card">
    <h2>Sign in</h2>
    <p class="hint">This server requires a token.</p>
    <form id="login-form">
      <input type="password" id="login-token" placeholder="API token" autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <p id="login-status" class="hint" hidden></p>
  </div>
</div>
<main>
  <section id="play-pane">
    <h2>Direct ZPL</h2>
    <textarea id="play-zpl" rows="6" spellcheck="false"
      placeholder="^XA^FO20,20^A0N,32,32^FDHello Zebra^FS^XZ"></textarea>
    <div class="play-bar">
      <button id="play-go" type="button">Render</button>
      <span id="play-status" class="hint"></span>
    </div>
    <div id="play-img-wrap" hidden>
      <img id="play-img" alt="direct render">
    </div>
  </section>
  <section id="list-pane">
    <div id="list-head">
      <h2>Labels</h2>
      <button id="clear-all" type="button" hidden>Clear all</button>
    </div>
    <div id="label-list"><p class="hint">No labels yet &mdash; send one to the TCP port.</p></div>
  </section>
  <section id="detail-pane" hidden>
    <h2>Label <span id="detail-id"></span></h2>
    <div id="img-wrap">
      <img id="detail-img" alt="label render">
      <canvas id="overlay"></canvas>
    </div>
    <label id="overlay-toggle"><input type="checkbox" id="overlay-on"> Show field boxes</label>
    <div id="diag-list"></div>
    <h3>Raw ZPL</h3>
    <pre id="zpl-view"></pre>
    <h3>IR</h3>
    <pre id="ir-view"></pre>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
