[package]
name = "zpl-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
axum = "0.8"
zpl = { path = "../zpl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }

# Windows-service support: only compiled on Windows. On every other target this
# block is absent, so non-Windows builds are byte-for-byte unchanged.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Task 23 canaries decode the archived PNGs to prove "blank render".
png = "0.17"
