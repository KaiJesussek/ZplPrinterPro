[package]
name = "zpl"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.17"
ab_glyph = "0.2"
encoding_rs = "0.8"

[dev-dependencies]
serde_json = "1"
# Task 18: fuzz invariants over parser + renderer (dev-only).
proptest = "1"
# Task 16 verification: rqrr decodes QR module maps (dark = 0 luma) back
# to text; `image` supplies the GrayImage type.
rqrr = "0.11"
image = { version = "0.25", default-features = false }
